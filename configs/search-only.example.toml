default_query = ""

[[sources]]
name = "X JP Hit Media Tweets"
kind = "x_hit_media_search"
query = "lang:ja filter:media min_faves:1000 -filter:replies"
search_mode = "top"
tags = ["x", "twitter", "japan", "hit-tweets"]
priority = 50
summary = "High-like Japanese tweets containing images or video."

[[sources]]
name = "X JP Fresh Hit Media"
