<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>contentgrab</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="control-panel" aria-label="Collection controls">
        <div class="brand">
          <div class="mark">CG</div>
          <div>
            <h1>contentgrab</h1>
            <p>Trending Japanese social media with media</p>
          </div>
        </div>

        <form id="collect-form" class="form-stack">
          <div class="mode-card">
            <strong>Trend-first mode</strong>
            <p>Collects current Japan X trend terms and opens media-filtered social searches. No keyword prompt.</p>
          </div>
          <div class="inline-fields">
            <label>
              Trends
              <input id="limit" type="number" min="1" max="50" value="12">
            </label>
            <label>
              Min score
              <input id="min-score" type="number" min="0" value="1">
            </label>
          </div>
          <button class="primary" type="submit">Collect trending media</button>
        </form>

        <div class="source-box">
          <div class="panel-title">Sources</div>
          <div id="sources" class="source-list"></div>
        </div>
      </section>

      <section class="lead-panel" aria-label="Collected leads">
        <div class="toolbar">
          <div>
            <h2>Review Queue</h2>
            <p id="lead-count">No leads collected yet</p>
          </div>
          <div class="filters">
            <button class="chip is-active" type="button" data-filter="all">All</button>
            <button class="chip" type="button" data-filter="media-search">X media</button>
            <button class="chip" type="button" data-filter="ok">Fetched media</button>
            <button class="chip" type="button" data-filter="manual">Manual</button>
            <button class="chip" type="button" data-filter="error">Source notes</button>
          </div>
        </div>
        <div class="review-controls">
          <label>
            Source
            <select id="source-filter">
              <option value="all">All sources</option>
            </select>
          </label>
          <label class="check-row compact-check">
            <input id="preview-only" type="checkbox">
            Preview only
          </label>
        </div>
        <div id="status" class="status" role="status"></div>
        <div id="leads" class="lead-grid"></div>
      </section>

      <aside class="shortlist-panel" aria-label="Shortlist">
        <div class="toolbar compact">
          <div>
            <h2>Shortlist</h2>
            <p id="shortlist-count">0 saved</p>
          </div>
          <div class="shortlist-actions">
            <a class="secondary" href="/api/export/shortlist.md" target="_blank" rel="noreferrer">Markdown</a>
            <button id="clear-shortlist" class="secondary" type="button">Clear</button>
          </div>
        </div>

        <form id="shortlist-form" class="form-stack compact-form">
          <label>
            Pick indexes
            <input id="indexes" type="text" placeholder="1,3-5">
          </label>
          <label>
            Tags
            <input id="tags" type="text" placeholder="x,yahoo,girlschannel">
          </label>
          <label>
            Min score
            <input id="select-min-score" type="number" min="0" placeholder="6">
          </label>
          <label class="check-row">
            <input id="include-errors" type="checkbox">
            Include source notes
          </label>
          <button class="secondary full" type="submit">Build shortlist</button>
        </form>

        <div id="shortlist" class="shortlist"></div>
      </aside>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
