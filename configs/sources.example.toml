default_query = ""

[[sources]]
name = "X JP Hit Media Tweets"
kind = "x_hit_media_search"
query = "lang:ja filter:media min_faves:1000 -filter:replies"
search_mode = "top"
tags = ["x", "twitter", "japan", "hit-tweets"]
priority = 50
summary = "High-like Japanese tweets containing images or video."

[[sources]]
name = "X JP Fresh Hit Media"
kind = "x_hit_media_search"
query = "lang:ja filter:media min_faves:300 since:{since_2d} -filter:replies"
search_mode = "live"
tags = ["x", "twitter", "japan", "fresh", "hit-tweets"]
priority = 48
summary = "Recent Japanese media tweets that are already getting traction."

[[sources]]
name = "X JP Hit Video Tweets"
kind = "x_hit_media_search"
