<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>contentgrab</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <h1>contentgrab</h1>

        <form id="collect-form" class="collect-bar">
          <button class="primary" type="submit">Collect</button>
          <input id="limit" type="hidden" value="12">
          <input id="min-score" type="hidden" value="1">
        </form>
      </header>

      <section class="lead-panel" aria-label="Collected leads">
        <div class="review-bar">
          <p id="lead-count">No links yet</p>
          <p id="shortlist-count">0 selected</p>
          <button id="clear-shortlist" class="secondary selection-action" type="button">Clear</button>
        </div>

        <div id="status" class="status" role="status"></div>
        <div id="leads" class="lead-grid"></div>
      </section>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
