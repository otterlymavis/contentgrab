<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>contentgrab</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand">
          <div class="mark">CG</div>
          <div>
            <h1>contentgrab</h1>
            <p>Japanese entertainment hit posts with media</p>
          </div>
        </div>

        <form id="collect-form" class="collect-bar">
          <button class="primary" type="submit">Collect hit posts</button>
          <details class="options">
            <summary>Options</summary>
            <div class="option-grid">
              <label>
                Extra source limit
                <input id="limit" type="number" min="1" max="50" value="12">
              </label>
              <label>
                Min score
                <input id="min-score" type="number" min="0" value="1">
              </label>
            </div>
          </details>
        </form>
      </header>

      <section class="lead-panel" aria-label="Collected leads">
        <div class="section-head">
          <div>
            <h2>Entertainment Hit Posts</h2>
            <p id="lead-count">No leads collected yet</p>
          </div>
        </div>

        <div class="filters">
          <button class="chip is-active" type="button" data-filter="all">All</button>
          <button class="chip" type="button" data-filter="hit-search">X posts</button>
          <button class="chip" type="button" data-filter="ok">Previews</button>
          <button class="chip" type="button" data-filter="manual">Manual</button>
        </div>

        <div id="status" class="status" role="status"></div>
        <div id="leads" class="lead-grid"></div>
      </section>

      <aside class="shortlist-panel" aria-label="Shortlist">
        <div class="section-head compact">
          <div>
            <h2>Shortlist</h2>
            <p id="shortlist-count">0 saved</p>
          </div>
          <div class="shortlist-actions">
            <a class="secondary" href="/api/export/shortlist.md" target="_blank" rel="noreferrer">Markdown</a>
            <button id="clear-shortlist" class="secondary" type="button">Clear</button>
          </div>
        </div>

        <div id="shortlist" class="shortlist"></div>
      </aside>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
